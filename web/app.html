<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MRAkdown</title>
  <link rel="icon" href="/__app/logo.svg">
  <link rel="stylesheet" href="/__app/app.css">
  <script>
    // Apply the saved accent colour before first paint, so there is no flash of the default.
    try {
      const accent = JSON.parse(localStorage.getItem('accent'));
      if (accent) {
        document.documentElement.style.setProperty('--accent-light', accent.light);
        document.documentElement.style.setProperty('--accent-dark', accent.dark);
      }
    } catch { /* storage unavailable */ }
  </script>
  <script defer src="/__app/app.js"></script>
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <img class="logo" src="/__app/logo.svg" alt="">
      <span id="root-name"></span>
      <button id="new-note" title="New note (Ctrl+N)" aria-label="New note">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 18v-6"/></svg>
      </button>
      <button id="open-file" title="Open file (Ctrl+O)" aria-label="Open file">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
      </button>
      <button id="open-folder" title="Open folder (Ctrl+Shift+O)" aria-label="Open folder">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="toggle-side" title="Hide folder panel (Ctrl+\)" aria-label="Hide folder panel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <input id="filter" type="search" placeholder="Search notes  (Ctrl+P)" autocomplete="off" spellcheck="false">
    <nav id="tree"></nav>
  </aside>
  <div id="resizer"></div>
  <main id="main">
    <div id="tabbar">
    <button id="show-side" class="toggle-side" title="Show folder panel (Ctrl+\)" aria-label="Show folder panel">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <div id="tabs" role="tablist" aria-label="Open notes"></div>
    <div id="toolbar" role="group" aria-label="View mode">
      <span id="unsaved" title="Unsaved changes (Ctrl+S to save)"></span>
      <button id="accent-button" title="Accent colour" aria-label="Accent colour" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.8.7-1.5 1.5-1.5H16a5 5 0 0 0 5-5c0-4.2-4-7.4-9-7.4z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>
      </button>
      <button id="format-toggle" title="Show or hide the formatting toolbar" aria-label="Formatting toolbar" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
      </button>
      <span id="format-sep" aria-hidden="true"></span>
      <button data-mode="read" title="Read (Ctrl+E)" aria-label="Read">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>
      </button>
      <button data-mode="edit" title="Edit (Ctrl+E)" aria-label="Edit">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button data-mode="split" title="Split: edit and preview (Ctrl+Shift+E)" aria-label="Split view">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
      </button>
    </div>
    </div>
    <div id="panes">
      <div id="view">
        <article id="content" class="markdown"></article>
      </div>
    </div>
  </main>
</body>
</html>
