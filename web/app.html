<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MRAkdown</title>
  <link rel="icon" href="/__app/logo.svg">
  <link rel="stylesheet" href="/__app/app.css">
  <script>
    // Apply the saved accent colour and theme before first paint, so there is no flash of the defaults.
    try {
      const accent = JSON.parse(localStorage.getItem('accent'));
      if (accent) {
        document.documentElement.style.setProperty('--accent-light', accent.light);
        document.documentElement.style.setProperty('--accent-dark', accent.dark);
      }
      const theme = JSON.parse(localStorage.getItem('theme'));
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch { /* storage unavailable */ }
  </script>
  <script defer src="/__app/app.js"></script>
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <img class="logo" src="/__app/logo.svg" alt="">
      <span id="root-name"></span>
      <button id="new-note" data-shortcut="newFile" data-hint="New file ({keys})" title="New file" aria-label="New file">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 18v-6"/></svg>
      </button>
      <button id="open-file" data-shortcut="openFile" data-hint="Open file ({keys})" title="Open file" aria-label="Open file">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
      </button>
      <button id="open-folder" data-shortcut="openFolder" data-hint="Open folder ({keys})" title="Open folder" aria-label="Open folder">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button id="tree-show" title="Files to show" aria-label="Files to show" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
      </button>
      <button class="toggle-side" data-shortcut="toggleSidebar" data-hint="Hide folder panel ({keys})" title="Hide folder panel" aria-label="Hide folder panel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <input id="filter" type="search" data-shortcut="search" data-hint="Search files  ({keys})" placeholder="Search files" autocomplete="off" spellcheck="false">
    <nav id="tree"></nav>
  </aside>
  <div id="resizer"></div>
  <main id="main">
    <!-- One or two panes side by side, made from the template below (see "Panes" in app.js). -->
    <div id="panes"></div>
  </main>
  <!-- Single buttons that app.js places in the panes' tab bars: the first pane's start and the last pane's toolbar. -->
  <div hidden>
    <button id="show-side" class="toggle-side" data-shortcut="toggleSidebar" data-hint="Show folder panel ({keys})" title="Show folder panel" aria-label="Show folder panel">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <button id="settings-button" title="Settings" aria-label="Settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  <template id="pane-template">
    <section class="pane" data-mode="read">
      <div class="tabbar">
        <div class="tabs" role="tablist" aria-label="Open files"></div>
        <button class="new-tab" data-shortcut="newTab" data-hint="New tab ({keys})" title="New tab" aria-label="New tab">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div class="toolbar" role="group" aria-label="View mode">
          <span class="unsaved" data-shortcut="save" data-hint="Unsaved changes ({keys} to save)" title="Unsaved changes"></span>
          <button class="format-toggle" title="Show or hide the formatting toolbar" aria-label="Formatting toolbar" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
          </button>
          <span class="format-sep" aria-hidden="true"></span>
          <!-- The modes are named for what they are: data-mode="live" is Edit (edit it as it looks), data-mode="edit"
               is Source (the plain text). The internal names stay, so saved settings and shortcuts keep working. -->
          <span class="mode-switch" role="group" aria-label="View">
          <button data-mode="read" data-shortcut="toggleLive" data-hint="Read ({keys})" title="Read" aria-label="Read">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/></svg>
          </button>
          <button data-mode="live" data-shortcut="toggleLive" data-hint="Edit ({keys})" title="Edit" aria-label="Edit">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button data-mode="edit" data-shortcut="toggleEdit" data-hint="Source: the plain text ({keys})" title="Source: the plain text" aria-label="Source">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
          </button>
          <button data-mode="split" data-shortcut="toggleSplit" data-hint="Split: source and preview ({keys})" title="Split: source and preview" aria-label="Split view">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
          </button>
          </span>
        </div>
      </div>
      <div class="pane-body">
        <div class="view">
          <article class="content markdown"></article>
        </div>
      </div>
    </section>
  </template>
</body>
</html>
